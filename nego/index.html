<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>네고 이벤트 예약 · 소니드</title>
<style>
  :root{
    --bg:#f5f3f0; --surface:#ffffff; --surface-2:#faf8f6; --line:#e7e1db; --line-2:#efeae5;
    --ink:#26313f; --muted:#7c8794; --faint:#a7b0ba;
    --accent:#3f566e; --accent-2:#2c3d4e; --accent-soft:#e9edf1;
    --gold:#93999f; --navy:#26313f;
    --ok:#2f9e6f; --ok-soft:#e2f3ec; --warn:#c9863a; --warn-soft:#f8ecdc; --bad:#cf5b52; --bad-soft:#fbe7e4;
    --shadow:0 1px 2px rgba(38,49,63,.10); --shadow-lg:0 6px 18px rgba(38,49,63,.14);
    --r:5px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171b20; --surface:#20262e; --surface-2:#252c35; --line:#333c47; --line-2:#2b333d;
      --ink:#eef2f6; --muted:#9aa6b2; --faint:#6d7885;
      --accent:#8ba6bd; --accent-2:#a7bccd; --accent-soft:#242d36;
      --gold:#8b929a; --navy:#e8edf2;
      --ok:#4cc48c; --ok-soft:#173226; --warn:#e0a44e; --warn-soft:#33260f; --bad:#ef7d74; --bad-soft:#37211f;
      --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 6px 18px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171b20; --surface:#20262e; --surface-2:#252c35; --line:#333c47; --line-2:#2b333d;
    --ink:#eef2f6; --muted:#9aa6b2; --faint:#6d7885;
    --accent:#8ba6bd; --accent-2:#a7bccd; --accent-soft:#242d36;
    --gold:#8b929a; --navy:#e8edf2; --ok:#4cc48c; --ok-soft:#173226; --warn:#e0a44e; --warn-soft:#33260f; --bad:#ef7d74; --bad-soft:#37211f;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 6px 18px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#f5f3f0; --surface:#ffffff; --surface-2:#faf8f6; --line:#e7e1db; --line-2:#efeae5;
    --ink:#26313f; --muted:#7c8794; --faint:#a7b0ba;
    --accent:#3f566e; --accent-2:#2c3d4e; --accent-soft:#e9edf1;
    --ok:#2f9e6f; --ok-soft:#e2f3ec; --warn:#c9863a; --warn-soft:#f8ecdc; --bad:#cf5b52; --bad-soft:#fbe7e4;
    --shadow:0 1px 2px rgba(38,49,63,.10); --shadow-lg:0 6px 18px rgba(38,49,63,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;-webkit-text-size-adjust:100%;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  .tnum{font-variant-numeric:tabular-nums}
  /* ---- header ---- */
  header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .brand .dot{width:30px;height:30px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none}
  .brand h1{font-size:1.02rem;margin:0;font-weight:800;letter-spacing:-.01em}
  .brand .sub{font-size:.68rem;color:var(--muted);font-weight:600}
  .brand .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:4px;width:34px;height:34px;font-size:15px;cursor:pointer}
  .tabs{display:flex;gap:6px}
  .tab{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.92rem;padding:11px 8px;cursor:pointer;border-bottom:2.5px solid transparent;position:relative;letter-spacing:-.01em}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .lock{font-size:.7rem;opacity:.7;margin-left:3px}
  /* ---- toolbar ---- */
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 90px}
  .tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .search{flex:1;min-width:150px;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
  .search input{border:none;background:transparent;color:var(--ink);font-size:.9rem;width:100%;outline:none}
  select.sortsel,.ghostbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:9px 11px;font-size:.82rem;font-weight:600;cursor:pointer}
  /* ---- summary ---- */
  .sumrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 11px;border-top:2.5px solid var(--gold)}
  .metric .k{font-size:.66rem;color:var(--muted);font-weight:600}
  .metric .v{font-size:1.0rem;font-weight:800;margin-top:2px;letter-spacing:-.02em}
  .metric.a{border-top-color:var(--accent)}
  @media(max-width:560px){ .sumrow{grid-template-columns:repeat(2,1fr)} }
  /* ---- day group ---- */
  .daygroup{font-size:.76rem;font-weight:800;color:var(--muted);margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
  .daygroup::after{content:"";flex:1;height:1px;background:var(--line)}
  .daygroup .cnt{color:var(--accent);font-weight:700}
  /* ---- card ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .card:active{transform:scale(.995)}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .card .nm{font-weight:800;font-size:.95rem;letter-spacing:-.01em}
  .card .ord{font-size:.66rem;font-weight:700;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
  .pill{font-size:.66rem;font-weight:800;border-radius:4px;padding:2px 9px;margin-left:auto}
  .pill.pl{background:var(--accent-soft);color:var(--accent-2)}
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .pill.cancel{background:var(--bad-soft);color:var(--bad)}
  .lt tr.cxrow td{background:#3a3d42;color:#9aa0a8}
  .lt tr.cxrow td.nm{color:#b8bec6}
  .lt tr.cxrow .tel{color:#8b939c}
  .card.cxcard{background:#3a3d42;border-color:#2c2f34}
  .card.cxcard .nm,.card.cxcard .pkg,.card.cxcard .vv,.card.cxcard .amt{color:#aab0b8}
  .card .pkg{font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:6px}
  .card .times{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .tchip{flex:1;min-width:118px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 9px}
  .tchip .lb{font-size:.6rem;color:var(--faint);font-weight:700;letter-spacing:.02em}
  .tchip .vv{font-size:.86rem;font-weight:700;margin-top:1px;letter-spacing:-.01em}
  .tchip.visit{background:var(--accent-soft);border-color:transparent}
  .tchip.visit .vv{color:var(--accent-2)}
  .card .foot{display:flex;align-items:center;gap:9px;font-size:.74rem;color:var(--muted);flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:6px}
  .card .foot .who{font-weight:700;color:var(--ink)}
  .card .foot .amt{margin-left:auto;font-weight:800;color:var(--ink)}
  .card .memo{font-size:.74rem;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:5px 9px;margin-top:8px;font-weight:600}
  .card .tel{color:var(--accent-2);font-weight:700;text-decoration:none}
  .samebtn{font-size:.68rem;font-weight:700;color:var(--accent-2);background:var(--warn-soft);border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-left:6px;cursor:pointer;vertical-align:middle}
  .samebtn:active{opacity:.7}
  .smsok{display:inline-block;font-size:.66rem;font-weight:800;color:#1c7a4a;background:#d8f3e3;border:1px solid #a9e0c4;border-radius:4px;padding:1px 5px;cursor:pointer;vertical-align:middle;white-space:nowrap}
  .smsok:active{opacity:.6}
  .sms{text-decoration:none;font-size:1.05em;padding:2px 5px;margin-left:2px;border-radius:5px}
  .sms:active{background:rgba(120,120,120,.18)}
  .lt td.phc .tel{color:var(--accent-2);font-weight:600;text-decoration:none;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:56px 20px;font-weight:600}
  .empty .big{font-size:2.4rem;display:block;margin-bottom:10px}
  /* ---- FAB ---- */
  .fab{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:25;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:15px 20px;font-size:.98rem;font-weight:800;box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;gap:7px}
  /* ---- gate ---- */
  .gate{max-width:380px;margin:8vh auto;padding:26px 22px;text-align:center}
  .gate .emo{font-size:2.6rem}
  .gate h2{font-size:1.25rem;margin:12px 0 4px}
  .gate p{color:var(--muted);font-size:.86rem;margin:0 0 20px}
  .pininput{display:flex;gap:9px;justify-content:center;margin-bottom:8px}
  .pindot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);transition:.15s}
  .pindot.on{background:var(--accent);border-color:var(--accent)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:16px auto 0}
  .pad button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:16px 0;font-size:1.3rem;font-weight:700;cursor:pointer}
  .pad button:active{background:var(--accent-soft)}
  .pad button.blank{border:none;background:transparent;cursor:default}
  .gateerr{color:var(--bad);font-size:.82rem;font-weight:700;min-height:1.2em;margin-top:6px}
  /* ---- modal ---- */
  .modal-bd{position:fixed;inset:0;background:rgba(20,26,33,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .modal-bd.on{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:620px;max-height:94vh;border-radius:6px 6px 0 0;overflow:auto;box-shadow:var(--shadow-lg);animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  @media(min-width:620px){ .modal-bd{align-items:center} .sheet{border-radius:4px} }
  .sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);z-index:2}
  .sheet-h h3{margin:0;font-size:1.06rem;font-weight:800;flex:1}
  .sheet-b{padding:16px 18px 22px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
  .fld input,.fld select,.fld textarea{width:100%;min-width:0;max-width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:5px;padding:12px 13px;font-size:.98rem;font-family:inherit;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
  .fld textarea{min-height:64px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two>.fld{min-width:0}
  @media(max-width:560px){ .two{grid-template-columns:1fr} }
  .calcbox{background:var(--accent-soft);border-radius:5px;padding:12px 14px;margin:6px 0 16px}
  .calcbox .cr{display:flex;justify-content:space-between;font-size:.84rem;padding:3px 0;color:var(--accent-2)}
  .calcbox .cr b{font-weight:800}
  .segs{display:flex;gap:7px}
  .seg{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:4px;padding:10px;font-weight:700;font-size:.85rem;cursor:pointer;text-align:center}
  .seg.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .primary{width:100%;border:none;background:var(--accent);color:#fff;border-radius:5px;padding:15px;font-size:1.02rem;font-weight:800;cursor:pointer;margin-top:4px}
  .dangerbtn{width:100%;border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:5px;padding:12px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:10px}
  .xbtn{border:none;background:var(--surface-2);color:var(--muted);border-radius:4px;width:32px;height:32px;font-size:16px;cursor:pointer}
  .hint{font-size:.72rem;color:var(--faint);margin-top:5px}
  /* ---- 지점 선택 ---- */
  .selwrap{max-width:420px;margin:5vh auto;text-align:center}
  .seltitle{font-size:1.18rem;font-weight:800;margin-bottom:20px;letter-spacing:-.01em}
  .selcard{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
  .selcard:active{transform:scale(.99);border-color:var(--accent)}
  .selcard .se{font-size:1.8rem}
  .selcard .sn{font-size:1.12rem;font-weight:800;color:var(--ink)}
  .selcard .sa{margin-left:auto;font-size:1.5rem;color:var(--faint)}
  .selnote{font-size:.78rem;color:var(--muted);margin-top:12px}
  .backbar{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:5px;padding:9px 13px;font-size:.82rem;font-weight:700;cursor:pointer;margin-bottom:10px;width:100%;text-align:left}
  .backbar b{color:var(--accent)}
  /* 지점 색 구분 (압구정=초록 / 동탄=기본 하양) */
  body[data-branch="압구정점"]{ --btint:60,140,92; }
  body[data-branch="압구정점"] header{ background:rgba(var(--btint),.15); border-bottom:2px solid rgba(var(--btint),.65); }
  body[data-branch="압구정점"] .brand .dot{ background:rgb(var(--btint)); }
  body[data-branch="압구정점"] .backbar{ background:rgba(var(--btint),.18); border-color:rgba(var(--btint),.5); color:var(--ink); font-weight:800; }
  body[data-branch="압구정점"] .backbar b{ color:rgb(var(--btint)); }
  body[data-branch="압구정점"] .fab{ background:rgb(var(--btint)); }
  body[data-branch="압구정점"] .metric.a{ border-top-color:rgb(var(--btint)); }
  body[data-branch="압구정점"] .metric.a .v{ color:rgb(var(--btint)); }
  body[data-branch="압구정점"] .tchip.visit{ background:rgba(var(--btint),.16); }
  body[data-branch="압구정점"] .tchip.visit .vv{ color:rgb(var(--btint)); }
  body[data-branch="압구정점"] .pill.pl{ background:rgba(var(--btint),.16); color:rgb(var(--btint)); }
  body[data-branch="압구정점"] .daygroup .cnt{ color:rgb(var(--btint)); }
  body[data-branch="압구정점"] .selcard:active{ border-color:rgb(var(--btint)); }
  /* ---- 표(한 줄) 보기 ---- */
  .lt{width:100%;border-collapse:collapse;font-size:.82rem;min-width:600px}
  .lt th,.lt td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;white-space:nowrap}
  .lt th{font-size:.68rem;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
  .lt th.r,.lt td.r{text-align:right}
  .lt td.nm{font-weight:800}
  .lt td.warn{color:var(--bad);font-weight:800}
  .lt tbody tr{cursor:pointer}
  .lt tbody tr:hover{background:var(--surface-2)}
  .lt .pill{margin-left:0;display:inline-block}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="dot">S</div>
    <div>
      <h1>네고 이벤트 예약</h1>
      <div class="sub">소니드 × 미니쉬 · 얼굴윤곽</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="reloadBtn" title="전체 새로고침" onclick="hardRefresh()">🔄</button>
    <button class="iconbtn" id="adminBtn" title="관리자" onclick="openAdminPanel()">⚙️</button>
    <button class="iconbtn" id="themeBtn" title="테마">◐</button>
  </div>
  <div style="height:8px"></div>
</header>

<div id="app"></div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onPhotoFile(this.files&&this.files[0])">
<button class="fab" id="fab" style="display:none" onclick="openForm()">＋ 고객 추가</button>

<!-- form modal -->
<div class="modal-bd" id="formModal">
  <div class="sheet">
    <div class="sheet-h">
      <h3 id="formTitle">고객 추가</h3>
      <button class="xbtn" onclick="closeForm()">✕</button>
    </div>
    <div class="sheet-b">
      <div class="fld"><label>성함</label><input id="f_name" placeholder="예: 김수정(9170)"></div>
      <div class="fld"><label>연락처</label><input id="f_phone" type="tel" inputmode="numeric" placeholder="010-0000-0000"></div>
      <div class="fld"><label>가입 상품</label><select id="f_pkg" onchange="onPkg()"></select></div>
      <div class="fld"><label>⭐ 배정 리셋터 (담당자 입력)</label><select id="f_reset"></select></div>
      <div class="two">
        <div class="fld"><label>📅 예약일시 (네이버)</label><input id="f_reserve" type="datetime-local"></div>
        <div class="fld"><label>⭐ 방문 확정일시 (담당자 입력) <button type="button" class="samebtn" onclick="sameAsReserve()">= 요청일과 동일</button></label><input id="f_visit" type="datetime-local"></div>
      </div>
      <div class="fld"><label>네이버페이 결제완료액 (원)</label><input id="f_paid" type="number" inputmode="numeric" placeholder="0"><div class="hint" id="pkgHint"></div></div>
      <div class="fld"><label>상태</label>
        <div class="segs" id="statusSeg">
          <div class="seg on" data-st="예정">예정</div>
          <div class="seg" data-st="구매확정">구매확정</div>
          <div class="seg" data-st="취소">취소</div>
        </div>
      </div>
      <div class="fld"><label>비고</label><textarea id="f_memo" placeholder="특이사항 (예: 당일취소 80%환불)"></textarea></div>
      <div class="fld" id="infoFld" style="display:none"><label>예약 정보 (네이버 · 상세에만 표시)</label><div id="f_info" style="font-size:.82rem;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:10px 12px;line-height:1.6;word-break:break-all"></div></div>
      <button class="primary" onclick="saveForm()">저장</button>
      <button class="dangerbtn" id="delBtn" style="display:none" onclick="delForm()">삭제</button>
    </div>
  </div>
</div>

<!-- 안내문자 templates -->
<div class="modal-bd" id="tplModal">
  <div class="sheet">
    <div class="sheet-h"><h3 id="tplTitle">안내문자</h3><button class="xbtn" onclick="closeTpl()">✕</button></div>
    <div class="sheet-b">
      <div class="segs" id="tplTabs" style="flex-wrap:wrap"></div>
      <pre id="tplText" style="white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:inherit;font-size:.88rem;line-height:1.65;margin:12px 0;max-height:50vh;overflow:auto"></pre>
      <button class="primary" onclick="copyTpl()">📋 복사하기</button>
    </div>
  </div>
</div>

<!-- 급여 정산 -->
<div class="modal-bd" id="payModal">
  <div class="sheet">
    <div class="sheet-h"><h3 id="payTitle">정산</h3><button class="xbtn" onclick="closePay()">✕</button></div>
    <div class="sheet-b" id="payBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const won = n => "₩" + (Math.round(n||0)).toLocaleString("ko-KR");
const RESETTERS_COMMON = ["신대성","이소니"]; // 양쪽 지점 공통
const RESETTERS_BRANCH = { "동탄본점":["이수연","김려은","신경미"], "압구정점":["정수영","김현주"] };
function resettersFor(b){ return (RESETTERS_BRANCH[b]||[]).concat(RESETTERS_COMMON); }

async function pullBranch(b){
  try{
    const r=await fetch(SB_URL+"/rest/v1/gongu_reservations?select=id,rec&branch=eq."+encodeURIComponent(b),{headers:SB_H});
    if(!r.ok){ SYNC_STATE="로컬"; return false; }
    const rows=await r.json(); const arr=(rows||[]).map(x=>x.rec).filter(Boolean);
    const local=getData(b);
    if(!arr.length && local.length){ for(const rec of local){ await pushRec(b,rec); } SYNC_STATE="동기화됨"; return true; } // 서버 비었고 로컬 있으면 최초 업로드
    setData(b,arr); SYNC_STATE="동기화됨"; return true;
  }catch(e){ SYNC_STATE="로컬"; return false; }
}

    '<div class="gate">'+
      '<button class="ghostbtn" onclick="backToSelect()" style="margin-bottom:14px">← 지점 다시 선택</button>'+

function drawDots(){ const d=$("pinDots"); if(!d) return; d.innerHTML=""; for(let i=0;i<4;i++){ const s=document.createElement("div"); s.className="pindot"+(i<STATE.pinBuf.length?" on":""); d.appendChild(s); } }
function pinKey(k){ if(k==="del"){ STATE.pinBuf=STATE.pinBuf.slice(0,-1); drawDots(); return; } if(STATE.pinBuf.length>=4) return; STATE.pinBuf+=k; drawDots(); if(STATE.pinBuf.length===4) setTimeout(submitPin,120); }
function unlockBranch(b){ STATE.unlocked[b]=true; SYNC_STATE="…"; render(); pullBranch(b).then(()=>{ if(STATE.unlocked[b]&&STATE.branch===b) renderList(b); }); }
function submitPin(){ const b=STATE.branch; if(STATE.pinMode==="create"){ setPw(b,STATE.pinBuf); unlockBranch(b); } else { if(STATE.pinBuf===getPw(b)){ unlockBranch(b); } else { $("pinErr").textContent="비밀번호가 달라요. 다시 입력해주세요."; STATE.pinBuf=""; drawDots(); } } }
// 컴퓨터: 키보드로 비번 입력 (게이트 화면이 떠 있을 때만 작동)
document.addEventListener("keydown",function(e){
  if(!document.getElementById("pinDots")) return;
  if(e.key>="0"&&e.key<="9"){ pinKey(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ pinKey("del"); e.preventDefault(); }
  else if(e.key==="Enter"){ if(STATE.pinBuf.length===4) submitPin(); e.preventDefault(); }
});

let TPL_CUR=0, TPL_LIST=[];
function openTemplates(){ TPL_LIST=(TEMPLATES[STATE.branch]||[]).concat([TPL_COMMON]); TPL_CUR=0; $("tplTitle").textContent=STATE.branch+" 안내문자"; renderTpl(); $("tplModal").classList.add("on"); }
function closeTpl(){ $("tplModal").classList.remove("on"); }
function renderTpl(){ $("tplTabs").innerHTML=TPL_LIST.map((t,i)=>'<div class="seg'+(i===TPL_CUR?' on':'')+'" onclick="selTpl('+i+')">'+escHtml(t.t)+'</div>').join(""); $("tplText").textContent=TPL_LIST[TPL_CUR].x; }
function selTpl(i){ TPL_CUR=i; renderTpl(); }
function fallbackCopy(txt,cb){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); cb&&cb(); }
function copyTpl(){ const txt=TPL_LIST[TPL_CUR].x; const done=()=>toast("복사됐어요! 붙여넣기 하세요 :)"); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); } else fallbackCopy(txt,done); }
function toast(msg){ let t=$("toastEl"); if(!t){ t=document.createElement("div"); t.id="toastEl"; t.style.cssText="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#26313f;color:#fff;padding:12px 20px;border-radius:6px;font-size:.9rem;font-weight:700;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transition:.2s;max-width:88%;text-align:center;pointer-events:none"; document.body.appendChild(t); } t.textContent=msg; t.style.opacity="1"; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.opacity="0"; },2200); }

// ---- 📷 네이버 예약 캡처 → 자동 입력 ----
const WORKER_URL = "https://soneed-nego-ocr.soni0025.workers.dev"; // ⚠ 워커 배포 후 이 주소로 맞추기
function pickPhoto(){ const el=$("photoInput"); if(el){ el.value=""; el.click(); } }
function fileToB64(file){ return new Promise(function(res,rej){ const r=new FileReader(); r.onload=function(){ res(String(r.result).split(",")[1]); }; r.onerror=rej; r.readAsDataURL(file); }); }
async function onPhotoFile(file){
  if(!file) return;
  toast("사진 읽는 중… 잠시만요 ⏳");
  try{
    const b64=await fileToB64(file);
    const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:b64,media_type:file.type||"image/png",branch:STATE.branch})});
    const d=await r.json();
    if(!d||d.error){ toast("사진을 못 읽었어요 — 직접 입력해주세요"); openForm(); return; }
    openForm();
    if(d.name) $("f_name").value=d.name;
    if(d.phone) $("f_phone").value=d.phone;
    if(d.reserve) $("f_reserve").value=d.reserve;
    if(d.memo) $("f_memo").value=d.memo;
    if(d.info){ STATE.editInfo=d.info; $("f_info").textContent=d.info; $("infoFld").style.display=""; }
    if(d.pkg && PROGRAMS.some(function(p){return p[0]===d.pkg;})){ $("f_pkg").value=d.pkg; onPkg(); }
    toast("불러왔어요! 담당자·방문확정 채우고 저장하세요 ✅");
  }catch(e){ toast("사진 읽기 오류(워커 주소 확인) — 직접 입력해주세요"); openForm(); }
}
