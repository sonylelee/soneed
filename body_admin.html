<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONEED 바디 · 관리자 복구</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛟</text></svg>">
<style>
  :root{--bg:#12141a;--card:#1b1e26;--line:#2b2f3a;--ink:#e6e8ee;--mut:#98a0b0;--brand:#7aa2ff;--brand2:#9a7bff;--warn:#ffb454;--del:#ff6b8b;--ok:#4fd18b}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#181b22,#12141a);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#181b22,#12141a);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:11.5px;color:var(--mut)}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  button{font-size:14px;padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:#232733;color:var(--ink);cursor:pointer}
  button.pri{background:linear-gradient(90deg,var(--brand),var(--brand2));border:0;color:#fff;font-weight:800}
  button.ok{background:var(--ok);border:0;color:#08240f;font-weight:800}
  button:disabled{opacity:.5;cursor:default}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#12141a;color:var(--ink);font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px}
  .tabs{display:flex;gap:8px;margin:12px 0}
  .tabs button{flex:1;font-weight:800}
  .tabs button.on{background:var(--brand);border-color:var(--brand);color:#08122e}
  .rec{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
  .rec:hover{border-color:var(--brand)}
  .rec .nm{font-weight:800;flex:1;min-width:0}
  .rec .meta{font-size:12px;color:var(--mut)}
  .badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}
  .badge.del{background:#3a1c25;color:var(--del)}
  .muted{color:var(--mut);font-size:13px}
  .ov{position:fixed;inset:0;background:rgba(8,10,15,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .mh{position:sticky;top:0;background:linear-gradient(135deg,#20242e,#191c24);padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .ver{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:10px 14px;background:#161922}
  .ver.cur{border-color:var(--brand)}
  .ver .vt{font-size:12.5px;color:var(--mut)}
  .ver .vs{font-size:13.5px;margin:5px 0 8px;white-space:pre-wrap;word-break:break-word}
  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;background:#20242e;color:var(--ink);margin:2px 3px 0 0}
  .banner{background:#20242e;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.6}
  #login{max-width:340px;margin:60px auto}
  .row{display:flex;gap:8px;margin-top:9px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222733;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:.2s;z-index:99;pointer-events:none}
  .toast.on{opacity:1}
</style></head>
<body>
<header>
  <div><h1>SONEED 바디 · 관리자 복구</h1><div class="sub" id="who">로그인이 필요합니다</div></div>
  <button id="logoutBtn" style="display:none" onclick="logout()">로그아웃</button>
</header>

<div class="wrap">
  <!-- 로그인 -->
  <div id="login" class="card">
    <div style="font-weight:800;margin-bottom:10px">관리자 로그인</div>
    <input id="email" type="email" placeholder="이메일" autocomplete="username">
    <div style="height:8px"></div>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="row"><button class="pri" style="flex:1" onclick="login()">로그인</button></div>
    <div id="loginMsg" class="muted" style="margin-top:8px;color:var(--del)"></div>
  </div>

  <!-- 본문 -->
  <div id="main" style="display:none">
    <div class="banner">🛟 <b>복구 콘솔</b> — 기록의 <b>모든 이전 버전</b>(수정·삭제 직전 스냅샷)을 보고 임의 시점으로 되돌립니다. 되돌리기도 히스토리에 남아 다시 되돌릴 수 있어요. <b>대표/관리직원만</b> 접근됩니다.</div>
    <input id="q" placeholder="고객 이름 검색" oninput="paint()">
    <div class="tabs">
      <button id="tabAll" class="on" onclick="setTab('all')">전체 기록</button>
      <button id="tabDel" onclick="setTab('del')">🗑 삭제됨</button>
    </div>
    <div id="list"><div class="muted">불러오는 중…</div></div>
  </div>
</div>

<!-- 타임라인 모달 -->
<div id="ov" class="ov">
  <div class="modal">
    <div class="mh"><div><div style="font-weight:900" id="mName"></div><div class="sub" id="mSub"></div></div>
      <button onclick="closeOv()" style="background:rgba(255,255,255,.12);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px">×</button></div>
    <div id="verList" style="padding:6px 0 14px"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
var SB_URL='https://xzclowgorxhcbsfrrbop.supabase.co', SB_KEY='sb_publishable_66Ts2AQrKrjfitjTi11uCQ_dGXiY_EZ';
var REST=SB_URL+'/rest/v1', AUTH=SB_URL+'/auth/v1';
var tok=null, recs=[], tab='all', curRec=null;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2000);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function H(extra){var h={apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'};if(extra)for(var k in extra)h[k]=extra[k];return h;}
function itemCount(d){try{return d&&d.state?Object.keys(d.state).length:0;}catch(e){return 0;}}
function fmt(t){ if(!t)return ''; try{var d=new Date(t);return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}catch(e){return t;} }

async function login(){
  var email=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
  var msg=document.getElementById('loginMsg'); msg.textContent='';
  if(!email||!pw){msg.textContent='이메일·비밀번호를 입력하세요';return;}
  try{
    var r=await fetch(AUTH+'/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})});
    var j=await r.json();
    if(!r.ok||!j.access_token){msg.textContent='로그인 실패: '+(j.error_description||j.msg||('HTTP '+r.status));return;}
    tok=j.access_token;
    try{sessionStorage.setItem('badm_tok',tok);sessionStorage.setItem('badm_email',email);}catch(e){}
    afterLogin(email);
  }catch(e){msg.textContent='네트워크 오류: '+(e.message||e);}
}
function afterLogin(email){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='';
  document.getElementById('logoutBtn').style.display='';
  document.getElementById('who').textContent=email+' 로 로그인됨';
  loadRecords();
}
function logout(){tok=null;try{sessionStorage.removeItem('badm_tok');sessionStorage.removeItem('badm_email');}catch(e){}location.reload();}

async function loadRecords(){
  var box=document.getElementById('list'); box.innerHTML='<div class="muted">불러오는 중…</div>';
  try{
    var r=await fetch(REST+'/body_records?select=id,name,date,data,deleted_at,updated_at&order=updated_at.desc',{headers:H()});
    if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401?' (권한 없음 — 대표/관리직원 계정으로 로그인)':''));
    recs=await r.json(); paint();
  }catch(e){ box.innerHTML='<div class="muted" style="color:var(--del)">목록 실패: '+esc(e.message||e)+'</div>'; }
}
function setTab(t){tab=t;document.getElementById('tabAll').className=t==='all'?'on':'';document.getElementById('tabDel').className=t==='del'?'on':'';paint();}
function paint(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var arr=recs.filter(function(r){
    if(tab==='del' && !r.deleted_at)return false;
    if(tab==='all' && r.deleted_at)return false;   // 전체=현행만, 삭제는 별탭
    if(q && (r.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var box=document.getElementById('list');
  if(!arr.length){box.innerHTML='<div class="muted">'+(q?'검색 결과 없음':(tab==='del'?'삭제된 기록이 없어요':'기록이 없어요'))+'</div>';return;}
  box.innerHTML=arr.map(function(r){
    return '<div class="rec" onclick="openRec(\''+esc(r.id)+'\')">'
      +'<div class="nm">'+esc(r.name||'(이름없음)')+' <span class="meta">· '+itemCount(r.data)+'항목</span></div>'
      +'<div class="meta">'+esc(r.date||'')+'</div>'
      +(r.deleted_at?'<span class="badge del">삭제됨</span>':'')
      +'<span class="meta">›</span></div>';
  }).join('');
}

async function openRec(id){
  var r=recs.find(function(x){return x.id===id;}); if(!r)return; curRec=r;
  document.getElementById('mName').textContent=(r.name||'(이름없음)');
  document.getElementById('mSub').textContent='현재 '+itemCount(r.data)+'항목 · '+(r.deleted_at?'삭제 상태':'정상')+' · 최종수정 '+fmt(r.updated_at);
  var vl=document.getElementById('verList'); vl.innerHTML='<div class="muted" style="padding:12px 16px">이력 불러오는 중…</div>';
  document.getElementById('ov').style.display='flex';
  var hist=[];
  try{
    var q=await fetch(REST+'/body_records_history?record_id=eq.'+encodeURIComponent(id)+'&select=id,name,date,data,action,at&order=at.desc',{headers:H()});
    if(q.ok)hist=await q.json();
  }catch(e){}
  var out='';
  // 현재 상태
  out+='<div class="ver cur"><div class="vt">🟦 현재 상태 · '+fmt(r.updated_at)+'</div>'
    +'<div class="vs">'+summ(r.data)+'</div>'
    +(r.deleted_at?'<button class="ok" onclick="restore(\''+esc(id)+'\',\'undelete\')">🗑 삭제 취소(복원)</button>':'<span class="muted">지금 보이는 값</span>')+'</div>';
  if(!hist.length){ out+='<div class="muted" style="padding:6px 16px">이전 버전 기록이 아직 없어요. (히스토리 트리거 적용 후 수정/삭제부터 쌓입니다)</div>'; }
  hist.forEach(function(h,i){
    out+='<div class="ver"><div class="vt">'+(h.action==='delete'?'🗑 삭제 직전':'✎ 수정 직전')+' · '+fmt(h.at)+'</div>'
      +'<div class="vs">'+summ(h.data)+'</div>'
      +'<button class="ok" onclick="restoreVer('+i+')">↩ 이 버전으로 되돌리기</button></div>';
  });
  window._hist=hist;
  vl.innerHTML=out;
}
function summ(d){
  if(!d)return '<span class="muted">데이터 없음</span>';
  var s=d.state||{}, ks=Object.keys(s);
  var chips=ks.slice(0,14).map(function(k){return '<span class="tag">'+esc(k)+(s[k]>1?(' '+s[k]):'')+'</span>';}).join('');
  var more=ks.length>14?(' <span class="muted">+'+(ks.length-14)+'</span>'):'';
  var extra=[]; if(d.program)extra.push('프로그램:'+d.program); if(d.memo)extra.push('메모:'+d.memo);
  return (ks.length?chips+more:'<span class="muted">선택 자세 없음</span>')+(extra.length?'<div class="muted" style="margin-top:6px">'+esc(extra.join(' · '))+'</div>':'');
}
async function restoreVer(i){
  var h=(window._hist||[])[i]; if(!h||!curRec)return;
  if(!confirm('이 버전('+fmt(h.at)+')으로 되돌릴까요?\n지금 값은 히스토리에 남아 다시 되돌릴 수 있어요.'))return;
  await doPatch(curRec.id,{data:h.data,name:h.name,date:h.date,deleted_at:null});
}
async function restore(id,mode){
  if(mode==='undelete'){ if(!confirm('삭제를 취소하고 복원할까요?'))return; await doPatch(id,{deleted_at:null}); }
}
async function doPatch(id,body){
  body.updated_at=new Date().toISOString();
  try{
    var r=await fetch(REST+'/body_records?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:H({Prefer:'return=minimal'}),body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401?' (복구 권한 없음)':''));
    toast('복구 완료');
    closeOv(); await loadRecords();
  }catch(e){ toast('복구 실패: '+(e.message||e)); }
}
function closeOv(){document.getElementById('ov').style.display='none';}
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeOv();});

// 세션 복원
(function(){ try{var t=sessionStorage.getItem('badm_tok'),e=sessionStorage.getItem('badm_email'); if(t&&e){tok=t;afterLogin(e);}}catch(e){} })();
</script>
</body></html>
